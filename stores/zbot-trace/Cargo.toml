[package]
name = "zbot-trace"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
chrono = { workspace = true }
tracing = { workspace = true }

# Added by the tasks that first use them (keeps T5/T6 fast; defers the slow
# bundled DuckDB build to T8's de-risk gate):
#   zstd  (T7 TraceWriter)        — zstd = "0.13"
#   duckdb (T8 TraceAnalytics)    — duckdb = { version = "1", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }

[lints]
workspace = true
