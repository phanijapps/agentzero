[package]
name = "zbot-engram-adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "AgentZero compatibility adapter scaffold for Engram-backed stores"

[dependencies]
agent-runtime = { path = "../../runtime/agent-runtime" }
agent-primitives = { path = "../../runtime/agent-primitives" }
async-trait = { workspace = true }
chrono = { workspace = true }
engram-domain = { git = "https://github.com/phanijapps/engram", branch = "main" }
engram-belief = { git = "https://github.com/phanijapps/engram", branch = "main" }
engram-memory = { git = "https://github.com/phanijapps/engram", branch = "main" }
engram-integration = { git = "https://github.com/phanijapps/engram", branch = "main", features = ["sqlite"] }
engram-hierarchy = { git = "https://github.com/phanijapps/engram", branch = "main" }
engram-knowledge = { git = "https://github.com/phanijapps/engram", branch = "main" }
knowledge-graph = { path = "../../services/knowledge-graph" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
zbot-stores-domain = { path = "../zbot-stores-domain" }
zbot-stores = { path = "../zbot-stores" }
zbot-stores-traits = { path = "../zbot-stores-traits" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zbot-stores-conformance = { path = "../zbot-stores-conformance" }

[lints]
workspace = true
