name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast unit tests - run first
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Rust unit tests
        run: cargo test --workspace --lib

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install frontend deps
        run: cd apps/ui && npm ci

      - name: Run frontend unit tests
        run: cd apps/ui && npm test

  # Integration tests - run after unit tests pass
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Rust integration tests
        run: cargo test --workspace

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install frontend deps
        run: cd apps/ui && npm ci

      - name: Run frontend integration tests
        run: cd apps/ui && npm run test -- tests/integration/ --passWithNoTests

  ward-portable-creation:
    name: Ward portable creation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test selected Ward bundle publication
        run: cargo test -p gateway-services portable_

  # E2E tests - run after integration tests
  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/ui/package-lock.json
            e2e/playwright/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install deps
        run: |
          cd apps/ui
          npm ci
          cd ../../e2e/playwright
          npm ci

      - name: Install Playwright
        run: |
          cd apps/ui
          npx playwright install --with-deps chromium
          cd ../../e2e/playwright
          npx playwright install chromium

      - name: Build frontend
        run: cd apps/ui && npm run build

      - name: Build daemon
        run: cargo build -p daemon --bin zbotd

      - name: Run E2E tests (quick scenarios only)
        run: |
          set -euo pipefail
          daemon_log="$RUNNER_TEMP/zbotd-e2e.log"
          data_dir="$RUNNER_TEMP/zbot-e2e"
          mkdir -p "$data_dir"

          ./target/debug/zbotd \
            --host 127.0.0.1 \
            --data-dir "$data_dir" \
            --static-dir dist \
            >"$daemon_log" 2>&1 &
          daemon_pid=$!

          cleanup() {
            kill "$daemon_pid" 2>/dev/null || true
            wait "$daemon_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18791/api/health >/dev/null 2>&1; then
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                echo "another process answered health after zbotd exited"
                cat "$daemon_log"
                exit 1
              fi
              ready=true
              break
            fi
            if ! kill -0 "$daemon_pid" 2>/dev/null; then
              echo "zbotd exited before becoming ready"
              cat "$daemon_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            echo "zbotd did not become ready within 60 seconds"
            cat "$daemon_log"
            exit 1
          fi

          playwright_status=0
          (
            cd apps/ui
            # This required job is the bounded deterministic lane. Debug,
            # dashboard-era, and provider-backed suites belong in separately
            # provisioned jobs.
            npm run test:e2e:required
          ) || playwright_status=$?
          if (( playwright_status != 0 )); then
            cat "$daemon_log"
            exit "$playwright_status"
          fi
        env:
          CI: true

      - name: Run fresh-vault Ward archetype E2E
        run: cd e2e/playwright && npx playwright test full-mode/ward-archetypes.full.spec.ts --reporter=html
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/ui/playwright-report/
          retention-days: 7

      - name: Upload Ward archetype E2E results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ward-archetype-playwright-report
          path: e2e/playwright/playwright-report/
          retention-days: 7

  # Coverage report - optional, runs in parallel with integration tests.
  # Uses cargo-llvm-cov for consistency with sonarqube.yml and faster
  # installs vs tarpaulin (llvm-cov bundles with rustup llvm-tools).
  coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    continue-on-error: true  # Don't fail the whole workflow if coverage fails
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo llvm-cov --version || cargo install cargo-llvm-cov --locked

      - name: Generate Rust coverage (LCOV)
        # Excludes: agent-runtime MCP transports (stdio/http/sse/manager) drive real
        # subprocesses and HTTP — only covered by integration tests, not unit tests.
        # logging.rs registers a global tracing subscriber and is not unit-testable.
        # Gateway excludes: server.rs (daemon bootstrap), services/runtime.rs
        # (full AppState wiring), websocket/** (real-client lifecycle), and the
        # thin axum HTTP handler files (http/{artifacts,bridge,chat,…}.rs)
        # whose business logic lives in the services they delegate to. End-to-
        # end coverage for those handlers comes from gateway/tests/api_tests.rs
        # and friends, not per-handler unit tests.
        # Same regex is mirrored in `.github/workflows/sonarqube.yml` and
        # `sonar-project.properties` (sonar.coverage.exclusions).
        run: |
          cargo llvm-cov --workspace --lcov --output-path rust-lcov.info \
            --ignore-filename-regex '(runtime/agent-runtime/src/(mcp/(stdio|http|sse|manager)\.rs|logging\.rs)|gateway/src/(server\.rs|services/runtime\.rs|websocket/.*\.rs|http/(artifacts|bridge|chat|connectors|cron|embeddings|events|graph|ingest|mcps|memory|models|network|openapi|plugins|providers|sessions|settings|setup|skills|tools|upload|ward_actions|webhooks)\.rs))'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: rust-lcov.info
          flags: rust
          fail_ci_if_error: false

  # Frontend coverage
  frontend-coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install deps
        run: cd apps/ui && npm ci

      # 5 known-flaky frontend tests (App.test.tsx connection-pill,
      # Connector-Inbound-Log in http.test.ts) still exit non-zero even
      # though vitest emits coverage for the passing tests via
      # reportOnFailure: true. continue-on-error keeps Codecov from being
      # skipped. Drop once those tests are fixed.
      - name: Run coverage
        continue-on-error: true
        run: cd apps/ui && npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: apps/ui/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
