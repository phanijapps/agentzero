name: Security checks

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  # schedule:
  #   - cron: "23 6 * * 1" # Mondays 06:23 UTC (weekly)

permissions:
  contents: read

jobs:
  security:
    name: Rust + Node security scan
    runs-on: [self-hosted, zbot]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify GitHub Action runtimes
        run: python3 scripts/check_github_action_runtimes.py

      - name: Configure writable Cargo home
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-home/bin"
          printf 'CARGO_HOME=%s/cargo-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s/cargo-home/bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # ---------- Rust ----------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Rust fmt
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust dependency vulnerabilities (cargo audit)
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Rust dependency policy (cargo deny)
        run: cargo deny check

      - name: Rig dependency boundary
        run: python3 scripts/rig_boundary_check.py

      # ---------- Node / React ----------
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      # If your package-lock.json is not at repo root, set cache-dependency-path below.
      # with:
      #   node-version: "20"
      #   cache: "npm"
      #   cache-dependency-path: "frontend/package-lock.json"

      - name: Install Node dependencies
        run: npm ci
        working-directory: apps/ui

      - name: NPM audit (high+)
        run: node scripts/npm-audit-high.mjs apps/ui

      # ---------- Secrets scanning ----------
      - name: Clean stale gitleaks tmp (self-hosted runner)
        run: rm -f /tmp/gitleaks.tmp

      - name: Run Gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
