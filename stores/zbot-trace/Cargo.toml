[package]
name = "zbot-trace"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
chrono = { workspace = true }
tracing = { workspace = true }
zstd = "0.13"

# Added by the task that first uses it (defers the slow bundled DuckDB build to
# T8's de-risk gate):
#   duckdb (T8 TraceAnalytics)    — duckdb = { version = "1", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { workspace = true }
zstd = "0.13"

[lints]
workspace = true
