# ============================================================================
# AGENT ZERO - CARGO WORKSPACE
# ============================================================================

[workspace]
resolver = "2"
members = [
    # Stores - Backend-agnostic persistence interfaces
    "stores/zbot-stores",
    "stores/zbot-conversation",
    "stores/zbot-trace",
    "stores/zbot-engram-adapter",
    "stores/zbot-stores-conformance",
    "stores/zbot-stores-domain",
    "stores/zbot-stores-sqlite",
    "stores/zbot-runtime-sqlite",
    "stores/zbot-stores-traits",

    # Discovery - LAN service advertisement
    "discovery",

    # Runtime - Execution engine
    "runtime/agent-primitives",
    "runtime/agent-surfaces",
    "runtime/agent-runtime",
    "runtime/agent-tools",

    # Services - Standalone data services
    "services/api-logs",
    "services/daily-sessions",
    "services/execution-state",
    "services/knowledge-graph",

    # Gateway - Network layer
    "gateway/gateway-events",
    "gateway/gateway-templates",
    "gateway/gateway-connectors",
    "gateway/gateway-memory",
    "gateway/gateway-services",
    "gateway/gateway-execution",
    "gateway/gateway-hooks",
    "gateway/gateway-cron",
    "gateway/gateway-bus",
    "gateway/gateway-ws-protocol",
    "gateway/gateway-bridge",
    "gateway",

    # Apps - Runnable applications
    "apps/daemon",
    "apps/cli",
]

[workspace.package]
version = "2026.5.3"
edition = "2021"
authors = ["agentzero"]
license = "MIT"

# Keep local builds debuggable without retaining full debug information for
# every workspace and native dependency artifact.
[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1
incremental = false

[profile.dev.package.libduckdb-sys]
debug = 0

[profile.test.package.libduckdb-sys]
debug = 0

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3.32"
tokio-stream = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
glob = "0.3"
glob-match = "0.2"
rust-embed = { version = "8", features = ["debug-embed"] }
lazy_static = "1.5"
base64 = "0.22"
once_cell = "1.21"
indexmap = "2.14.0"
# JSON Schema derivation for Rig extractors (typed structured output). Pinned to
# the version rig 0.39.0 resolves, so the lockfile stays single-version.
schemars = "1.2.1"
gethostname = "0.5"

# Networking
mdns-sd = "0.13"
if-addrs = "0.13"

# Tokenization (real tokenizer for middleware token counting)
tiktoken-rs = "0.11"

[workspace.lints.clippy]
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
fn_params_excessive_bools = "allow"
items_after_statements = "allow"
unnecessary_wraps = "allow"

[workspace.lints.rust]
missing_docs = "allow"
